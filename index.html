<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SENAI ID - Cadastro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            width: 565px;
            max-width: 94%;
            background: white;
            border-radius: 8px;
            padding: 50px 52px;
            box-shadow: 0 2px 18px rgba(0, 0, 0, 0.15);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-senai {
            width: 190px;
            height: auto;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            font-weight: 400;
            margin: 0 0 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 17px;
            margin-bottom: 35px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 16px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 62px;
            border: 1px solid #aaa;
            border-radius: 5px;
            padding: 0 17px;
            font-size: 18px;
            outline: none;
        }

        input:focus {
            border-color: #00843d;
            box-shadow: 0 0 0 2px rgba(0, 132, 61, .12);
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 25px 0;
        }

        .terms input {
            width: 20px;
            height: 20px;
            margin: 1px 0 0;
        }

        .terms label {
            font-size: 14px;
            color: #555;
            line-height: 1.4;
        }

        button {
            width: 100%;
            height: 62px;
            border: none;
            border-radius: 5px;
            background: #00843d;
            color: white;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #006f34;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-top: 28px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo-area">
            <img
                src="logo-senai.png"
                alt="SENAI"
                class="logo-senai"
            >
        </div>

        <h1>Crie sua conta</h1>

        <div class="subtitle">
            Cadastre-se para continuar
        </div>

        <form id="cadastro">

            <div class="field">
                <label for="nome">Nome completo</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >
            </div>

            <div class="field">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="field">
                <label for="senha">
                    Senha de demonstração
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite uma senha fictícia"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="field">
                <label for="confirmar">
                    Confirme a senha de demonstração
                </label>

                <input
                    type="password"
                    id="confirmar"
                    placeholder="Digite novamente"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="terms">

                <input
                    type="checkbox"
                    id="termos"
                    required
                >

                <label for="termos">
                    Concordo com os termos de uso e desejo
                    continuar.
                </label>

            </div>

            <button type="submit">
                Criar conta
            </button>

        </form>

        <div class="footer">
            SENAI ID
        </div>

    </div>


    <script>

        const formulario =
            document.getElementById("cadastro");

        formulario.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                const senha =
                    document.getElementById("senha").value;

                const confirmar =
                    document.getElementById("confirmar").value;

                if (senha !== confirmar) {

                    alert("As senhas não coincidem.");

                    return;
                }

                /*
                 * Nenhum dado é enviado para servidor.
                 * Nenhum dado é colocado na URL.
                 * A página simplesmente inicia a
                 * simulação pedagógica.
                 */

                window.location.href =
                    "simulacao.html";

            }
        );

    </script>

</body>

</html>
